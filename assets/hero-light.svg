<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc" fill="none"><title id="title">Anupam Roy — I build AI systems that prove their work</title><desc id="desc">Anupam Roy, AI/ML Analyst at Accenture in Kolkata, India. Headline: I build AI systems that prove their work. Multi-agent GenAI platforms, cite-or-abstain retrieval and guarded automation. Metrics: in production since 2022, about 20% faster turnaround, about 50% less SME dependency, 74 certifications. A terminal panel animates an evidence-first run: route, retrieve, correlate, cite, gate, propose and hand off to a human.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}.pk{display:none}}.ln{animation:16s ease-out infinite both}@keyframes l0{0%,2%{opacity:0;transform:translateX(-8px)}4.5%,90%{opacity:1;transform:none}96%,100%{opacity:0}}.l0{animation-name:l0}@keyframes l1{0%,5.2%{opacity:0;transform:translateX(-8px)}7.7%,90%{opacity:1;transform:none}96%,100%{opacity:0}}.l1{animation-name:l1}@keyframes l2{0%,8.4%{opacity:0;transform:translateX(-8px)}10.9%,90%{opacity:1;transform:none}96%,100%{opacity:0}}.l2{animation-name:l2}@keyframes l3{0%,11.6%{opacity:0;transform:translateX(-8px)}14.1%,90%{opacity:1;transform:none}96%,100%{opacity:0}}.l3{animation-name:l3}@keyframes l4{0%,14.8%{opacity:0;transform:translateX(-8px)}17.3%,90%{opacity:1;transform:none}96%,100%{opacity:0}}.l4{animation-name:l4}@keyframes l5{0%,18%{opacity:0;transform:translateX(-8px)}20.5%,90%{opacity:1;transform:none}96%,100%{opacity:0}}.l5{animation-name:l5}@keyframes l6{0%,21.2%{opacity:0;transform:translateX(-8px)}23.7%,90%{opacity:1;transform:none}96%,100%{opacity:0}}.l6{animation-name:l6}@keyframes l7{0%,24.4%{opacity:0;transform:translateX(-8px)}26.9%,90%{opacity:1;transform:none}96%,100%{opacity:0}}.l7{animation-name:l7}@keyframes l8{0%,27.6%{opacity:0;transform:translateX(-8px)}30.1%,90%{opacity:1;transform:none}96%,100%{opacity:0}}.l8{animation-name:l8}.cur{animation:blink 1.05s steps(1) infinite}@keyframes blink{50%{opacity:0}}.ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ring{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}.orb{animation:orb 12s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes orb{to{transform:translate(-60px,40px) scale(1.15)}}</style><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F7FD"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#E3EBF5"/></pattern><clipPath id="clip"><rect width="1200" height="500" rx="24"/></clipPath><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1F6FEB"/><stop offset=".55" stop-color="#0F766E"/><stop offset="1" stop-color="#15803D"/></linearGradient><radialGradient id="glowA"><stop offset="0" stop-color="#1F6FEB" stop-opacity=".30"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></radialGradient><radialGradient id="glowB"><stop offset="0" stop-color="#0F766E" stop-opacity=".22"/><stop offset="1" stop-color="#0F766E" stop-opacity="0"/></radialGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity=".22"/></filter></defs><rect x="0" y="0" width="1200" height="500" rx="24" fill="url(#bgGrad)"/><rect x="0" y="0" width="1200" height="500" rx="24" fill="url(#dots)" opacity="0.7"/><rect x="0.75" y="0.75" width="1198.5" height="498.5" rx="24" fill="none" stroke="#D7E1EE" stroke-width="1.5"/><g clip-path="url(#clip)"><circle class="orb" cx="1010" cy="70" r="330" fill="url(#glowA)"/><circle cx="250" cy="520" r="300" fill="url(#glowB)"/></g><rect x="56" y="44" width="272.24" height="32" rx="16" fill="#FFFFFF" stroke="#D7E1EE" stroke-width="1"/><circle class="ring" cx="76" cy="60" r="5" fill="#15803D"/><circle cx="76" cy="60" r="5" fill="#15803D"/><text x="90" y="64.5" font-size="11.5" fill="#0E1A2B" font-weight="700" letter-spacing="1.2" class="m">OPEN TO HIGH-IMPACT AI ROLES</text><text x="54" y="150" font-size="60" fill="#0E1A2B" font-weight="800" letter-spacing="-1">Anupam Roy</text><text x="57" y="186" font-size="13" fill="#475A72" font-weight="600" letter-spacing="1.6" class="m">AI/ML ANALYST @ ACCENTURE · SINCE 2022 · KOLKATA, INDIA</text><text x="56" y="246" font-size="36" fill="#0E1A2B" font-weight="800" letter-spacing="-0.5">I build AI systems</text><text x="56" y="288.48" font-size="36" fill="url(#acc)" font-weight="800" letter-spacing="-0.5">that prove their work.</text><text x="57" y="334" font-size="16.25" fill="#475A72">Multi-agent GenAI platforms, cite-or-abstain retrieval and guarded</text><text x="57" y="357.07" font-size="16.25" fill="#475A72">automation, from enterprise production to 18 public builds.</text><rect x="56" y="390" width="188" height="72" rx="14" fill="#FFFFFF" stroke="#D7E1EE" stroke-width="1"/><rect x="56" y="404" width="3" height="44" rx="1.5" fill="#15803D"/><text x="74" y="423" font-size="24" fill="#15803D" font-weight="800">≈20%</text><text x="74" y="445" font-size="14" fill="#475A72">faster turnaround</text><rect x="254" y="390" width="188" height="72" rx="14" fill="#FFFFFF" stroke="#D7E1EE" stroke-width="1"/><rect x="254" y="404" width="3" height="44" rx="1.5" fill="#0F766E"/><text x="272" y="423" font-size="24" fill="#0F766E" font-weight="800">≈50%</text><text x="272" y="445" font-size="14" fill="#475A72">less SME dependency</text><rect x="452" y="390" width="188" height="72" rx="14" fill="#FFFFFF" stroke="#D7E1EE" stroke-width="1"/><rect x="452" y="404" width="3" height="44" rx="1.5" fill="#B45309"/><text x="470" y="423" font-size="24" fill="#B45309" font-weight="800">74</text><text x="470" y="445" font-size="14" fill="#475A72">certifications</text><g filter="url(#shadow)"><rect x="668" y="44" width="488" height="412" rx="18" fill="#0F172A" stroke="#22324A" stroke-width="1.2"/></g><path d="M668 84H1156" stroke="#1E2B40"/><circle cx="690" cy="64" r="5.5" fill="#F87171"/><circle cx="708" cy="64" r="5.5" fill="#FBBF24"/><circle cx="726" cy="64" r="5.5" fill="#4ADE80"/><text x="912" y="69" font-size="12" fill="#7C8DA6" font-weight="600" text-anchor="middle" class="m">proof-trace — evidence-first run</text><g class="ln l0"><text x="692" y="122" font-size="14" fill="#4ADE80" font-weight="700" class="m">$</text><text x="712" y="122" font-size="14" fill="#E2E8F0" font-weight="500" class="m">ask &quot;why did last night&#x27;s batch job fail?&quot;</text></g><g class="ln l1"><text x="692" y="158" font-size="14" fill="#5EA0FF" font-weight="700" class="m">▸</text><text x="712" y="158" font-size="14" fill="#7DD3FC" font-weight="700" class="m">route</text><text x="814" y="158" font-size="14" fill="#A9B8CC" class="m">intent → incident agent</text><text x="1132" y="158" font-size="14" fill="#4ADE80" font-weight="700" text-anchor="end" class="m">✓</text></g><g class="ln l2"><text x="692" y="194" font-size="14" fill="#5EA0FF" font-weight="700" class="m">▸</text><text x="712" y="194" font-size="14" fill="#7DD3FC" font-weight="700" class="m">retrieve</text><text x="814" y="194" font-size="14" fill="#A9B8CC" class="m">logs · tickets · runbooks  k=12</text><text x="1132" y="194" font-size="14" fill="#4ADE80" font-weight="700" text-anchor="end" class="m">✓</text></g><g class="ln l3"><text x="692" y="230" font-size="14" fill="#5EA0FF" font-weight="700" class="m">▸</text><text x="712" y="230" font-size="14" fill="#7DD3FC" font-weight="700" class="m">correlate</text><text x="814" y="230" font-size="14" fill="#A9B8CC" class="m">3 similar past incidents</text><text x="1132" y="230" font-size="14" fill="#4ADE80" font-weight="700" text-anchor="end" class="m">✓</text></g><g class="ln l4"><text x="692" y="266" font-size="14" fill="#5EA0FF" font-weight="700" class="m">▸</text><text x="712" y="266" font-size="14" fill="#7DD3FC" font-weight="700" class="m">cite</text><text x="814" y="266" font-size="13.75" fill="#A9B8CC" class="m">[S1] [S4] [S7] → all sources resolve</text><text x="1132" y="266" font-size="14" fill="#4ADE80" font-weight="700" text-anchor="end" class="m">✓</text></g><g class="ln l5"><text x="692" y="302" font-size="14" fill="#5EA0FF" font-weight="700" class="m">▸</text><text x="712" y="302" font-size="14" fill="#7DD3FC" font-weight="700" class="m">gate</text><text x="814" y="302" font-size="14" fill="#A9B8CC" class="m">unsupported claim? → abstain</text><text x="1132" y="302" font-size="14" fill="#4ADE80" font-weight="700" text-anchor="end" class="m">✓</text></g><g class="ln l6"><text x="692" y="338" font-size="14" fill="#5EA0FF" font-weight="700" class="m">▸</text><text x="712" y="338" font-size="14" fill="#7DD3FC" font-weight="700" class="m">propose</text><text x="814" y="338" font-size="14" fill="#A9B8CC" class="m">root cause + 4-step fix</text><text x="1132" y="338" font-size="14" fill="#4ADE80" font-weight="700" text-anchor="end" class="m">✓</text></g><g class="ln l7"><text x="692" y="374" font-size="14" fill="#4ADE80" font-weight="700" class="m">✔</text><text x="712" y="374" font-size="14" fill="#4ADE80" font-weight="700" class="m">handoff</text><text x="814" y="374" font-size="14" fill="#A9B8CC" class="m">a human approves · audit logged</text></g><g class="ln l8"><text x="692" y="410" font-size="13.5" fill="#4ADE80" font-weight="700" class="m">$</text><rect x="712" y="398" width="8" height="15" rx="1" fill="#E2E8F0" class="cur"/></g><path d="M668 418H1156" stroke="#1E2B40"/><text x="692" y="441" font-size="11.5" fill="#6B7E99" font-weight="600" class="m">policy: cite-or-abstain · fail closed · human-in-the-loop</text></svg>
