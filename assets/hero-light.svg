<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Anupam Roy — AI Systems Observatory</title>
<desc id="desc">A geometric mission-control banner showing Anupam Roy at the center of agentic AI, retrieval, cloud, automation, security, and data systems.</desc><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF4FD"/><stop offset="1" stop-color="#F8FBFD"/></linearGradient>
  <radialGradient id="core"><stop offset="0" stop-color="#2783DE" stop-opacity=".45"/><stop offset="1" stop-color="#2783DE" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; }
    .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing: 1.8px; }
    .orbit { animation: spin 22s linear infinite; transform-origin: 910px 258px; }
    .orbit.reverse { animation-direction: reverse; animation-duration: 30s; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin: 910px 258px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity:.45; transform:scale(.94); } 50% { opacity:.9; transform:scale(1.04); } }
    @media (prefers-reduced-motion: reduce) { .orbit,.pulse { animation:none; } }
  </style>
</defs>
<rect x="1" y="1" width="1198" height="518" rx="24" fill="url(#bg)" stroke="#D8E4EE" stroke-width="2"/>
<g opacity=".36" stroke="#DCE7EF" stroke-width="1"><path d="M40 0V520"/><path d="M80 0V520"/><path d="M120 0V520"/><path d="M160 0V520"/><path d="M200 0V520"/><path d="M240 0V520"/><path d="M280 0V520"/><path d="M320 0V520"/><path d="M360 0V520"/><path d="M400 0V520"/><path d="M440 0V520"/><path d="M480 0V520"/><path d="M520 0V520"/><path d="M560 0V520"/><path d="M600 0V520"/><path d="M640 0V520"/><path d="M680 0V520"/><path d="M720 0V520"/><path d="M760 0V520"/><path d="M800 0V520"/><path d="M840 0V520"/><path d="M880 0V520"/><path d="M920 0V520"/><path d="M960 0V520"/><path d="M1000 0V520"/><path d="M1040 0V520"/><path d="M1080 0V520"/><path d="M1120 0V520"/><path d="M1160 0V520"/><path d="M0 40H1200"/><path d="M0 80H1200"/><path d="M0 120H1200"/><path d="M0 160H1200"/><path d="M0 200H1200"/><path d="M0 240H1200"/><path d="M0 280H1200"/><path d="M0 320H1200"/><path d="M0 360H1200"/><path d="M0 400H1200"/><path d="M0 440H1200"/><path d="M0 480H1200"/></g><rect x="50" y="47" width="162" height="34" rx="17" fill="#EEF5FB" stroke="#D8E4EE"/>
