<text x="54" y="252" font-size="23" font-weight="650" fill="#5E6C79">Production AI &amp; ML Engineer</text>
<text x="54" y="306" font-size="18" fill="#17212B">I turn operational noise into governed action—</text>
<text x="54" y="336" font-size="18" fill="#17212B">with agents, retrieval, automation, and resilient APIs.</text>
