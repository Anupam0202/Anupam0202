<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc" fill="none"><title id="title">Technology stack</title><desc id="desc">Technology stack. AI &amp; LLM systems: at work, LangGraph, LangChain, RAG pipelines, Vector search, Prompt engineering; in public repos, Gemini API, Vertex AI, Google ADK, Qdrant, FAISS + BM25, Cross-encoders, TensorFlow. Backend &amp; APIs: at work, Python, Core Java, Spring Boot, REST microservices; in public repos, FastAPI, Node.js, Express, WebSockets. Data: at work, MongoDB, PostgreSQL, Databricks, SQL generation; in public repos, Supabase, Firestore, Upstash Redis. Cloud &amp; platform: at work, AWS Lambda, AWS CodeBuild; in public repos, Cloud Run, Pub/Sub, Cloudflare Workers, Vercel, Docker. Frontend: at work, Chat-based assistant UI; in public repos, React, Next.js, TypeScript, Astro, Tailwind, Streamlit. Quality &amp; delivery: at work, CI/CD, JUnit, SonarQube, Selenium, UFT, Karate; in public repos, GitHub Actions, Playwright, Vitest, gitleaks. Enterprise integrations: at work, Jira, ServiceNow, Confluence, SharePoint, Splunk, GitHub; in public repos, none.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}.pk{display:none}}</style><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F7FD"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#E3EBF5"/></pattern><clipPath id="clip"><rect width="1200" height="790" rx="22"/></clipPath></defs><rect x="0" y="0" width="1200" height="790" rx="22" fill="url(#bgGrad)"/><rect x="0" y="0" width="1200" height="790" rx="22" fill="url(#dots)" opacity