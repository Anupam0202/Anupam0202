<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" fill="none"><title id="title">Enterprise AI Operational Assistant</title><desc id="desc">Enterprise AI Operational Assistant: A production multi-agent GenAI platform that replaced SME-heavy support, testing and release work. Signals from Jira, Confluence, SharePoint, GitHub, Splunk, Databases flow through a chat interface and a LangGraph orchestrator into specialist agents for incident, problem, release, service request, backed by RAG knowledge, RCA engine, SQL analyst, Test generator. Outcomes: resolution steps, test suites, release packs, servicenow tickets, sql fixes, sox reports. Impact: ≈20% faster turnaround; ≈50% less SME dependency; 4 agents behind one conversational interface.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}.pk{display:none}}.flow{stroke-dasharray:4 7;animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-22}}</style><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#0F1B2E"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1B2A42"/></pattern><clipPath id="clip"><rect width="1200" height="720" rx="22"/></clipPath><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EA0FF"/><stop offset=".55" stop-color="#2DD4BF"/><stop offset="1" stop-color="#4ADE80"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8Z" fill="#6B819C"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="22" fill="url(#bgGrad)"/><rect x="0"