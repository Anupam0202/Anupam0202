<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc" fill="none"><title id="title">Proof Atlas — flagship project</title><desc id="desc">Proof Atlas: A portfolio where every claim links to evidence, and its AI must cite it. Pipeline: Astro 7 (static pages + React islands) → Hashed CSP (on every page) → Express 5 API (as Vercel functions) → Egress guard (timeouts · caps · budgets) → Ask the Atlas (answers cite the ledger) → Evidence ledger (every key claim, sourced). Proof Workbench: repo evidence graph and in-browser document search. Citation integrity checks across Crossref and DataCite. Engineering Lab: RRF, binary search, Dijkstra, architecture x-ray. Full-history secret scan; mobile Lighthouse a11y and SEO gates. 371 unit + integration, 1,791 Playwright E2E, 430 prod smoke checks, ≥0.95 Lighthouse a11y. Stack: Astro, React, TypeScript, Express 5, Vercel, Vitest, Playwright, Gemini.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}.pk{display:none}}.pk{animation:pk 5s linear infinite}@keyframes pk{0%{transform:translateY(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateY(240px);opacity:0}}</style><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F7FD"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#E3EBF5"/></pattern><clipPath id="clip"><rect width="1200" height="400" rx="22"/></clipPath><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1F6FEB"/><stop offset=".55" stop-color="#0F766E"/><stop offset="1" stop-color="#15803D"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#1F6FEB" stop-opacity=".18"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1200" height="400" rx="22" fill="url(#bgGrad)"/><rect x="0" y="0" width="1200" height="400" rx="22" fill="url(#dots)" opacity="0.7"/><rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="22" fill="none" stroke="#D7E1EE" stroke-width="1.5"/><g clip-path="url(#clip)"><circle cx="1050" cy="-40" r="380" fill="url(#glow)"/></g><rect x="40" y="36" width="110.09" height="26" rx="13" fill="#FFFFFF" stroke="#D7E1EE" stroke-width="1"/><text x="95.04" y="52.96" font-size="11" fill="#1F6FEB" font-weight="700" text-anchor="middle" class="m">FLAGSHIP · 02</text><rect x="160.09" y="36" width="50.49" height="26" rx="13" fill="#FFFFFF" stroke="#D7E1EE" stroke-width="1"/><text x="185.33" y="52.96" font-size="11" fill="#15803D" font-weight="700" text-anchor="middle" class="m">LIVE</text><text x="38" y="112" font-size="46" fill="#0E1A2B" font-weight="800" letter-spacing="-1">Proof Atlas</text><text x="40" y="148" font-size="19" fill="#0E1A2B" font-weight="500">A portfolio where every claim links</text><text x="40" y="173.65" font-size="19" fill="#0E1A2B" font-weight="500">to evidence, and its AI must cite it.</text><circle cx="46" cy="214.3" r="3.2" fill="#0F766E"/><text x="60" y="219.3" font-size="13.75" fill="#475A72">Proof Workbench: repo evidence graph and in-browser document search</text><circle cx="46" cy="244.3" r="3.2" fill="#0F766E"/><text x="60" y="249.3" font-size="13.75" fill="#475A72">Citation integrity checks across Crossref and DataCite</text><circle cx="46" cy="274.3" r="3.2" fill="#0F766E"/><text x="60" y="279.3" font-size="13.75" fill="#475A72">Engineering Lab: RRF, binary search, Dijkstra, architecture x-ray</text><circle cx="46" cy="304.3" r="3.2" fill="#0F766E"/><text x="60" y="309.3" font-size="13.75" fill="#475A72">Full-history secret scan; mobile Lighthouse a11y and SEO gates</text><rect x=