 y="99" font-size="13" fill="#475A72" class="m">static pages + React islands</text><circle cx="640" cy="125" r="7" fill="#F4F8FD" stroke="#1F6FEB" stroke-width="2"/><text x="660" y="130.5" font-size="15.5" fill="#0E1A2B" font-weight="750">Hashed CSP</text><text x="816" y="130" font-size="13" fill="#475A72" class="m">on every page</text><circle cx="640" cy="156" r="7" fill="#F4F8FD" stroke="#1F6FEB" stroke-width="2"/><text x="660" y="161.5" font-size="15.5" fill="#0E1A2B" font-weight="750">Express 5 API</text><text x="816" y="161" font-size="13" fill="#475A72" class="m">as Vercel functions</text><circle cx="640" cy="187" r="7" fill="#F4F8FD" stroke="#1F6FEB" stroke-width="2"/><text x="660" y="192.5" font-size="15.5" fill="#0E1A2B" font-weight="750">Egress guard</text><text x="816" y="192" font-size="13" fill="#475A72" class="m">timeouts · caps · budgets</text><circle cx="640" cy="218" r="7" fill="#F4F8FD" stroke="#1F6FEB" stroke-width="2"/><text x="660" y="223.5" font-size="15.5" fill="#0E1A2B" font-weight="750">Ask the Atlas</text><text x="816" y="223" font-size="13" fill="#475A72" class="m">answers cite the ledger</text><circle cx="640" cy="249" r="7" fill="#F4F8FD" stroke="#15803D" stroke-width="2"/><text x="660" y="254.5" font-size="15.5" fill="#15803D" font-weight="750">Evidence ledger</text><text x="816" y="254" font-size="13" fill="#475A72" class="m">every key claim, sourced</text><rect x="610" y="288" width="130" height="70" rx="12" fill="#FFFFFF" stroke="#D7E1EE" stroke-width="1"/><text x="624" y="320" font-size="22" fill="#0E1A2B" font-weight="800">371</text><text x="624" y="340" font-size="11.5" fill="#475A72">unit + integration</text><rect x="750" y="288" width="130" height="70" rx="12" fill="#FFFFFF" stroke="#D7E1EE" stroke-width="1"/><text x="764" y="320" font-size="22" fill="#0E1A2B" font-weight="800">1,791</text><text x="764" y="340" font-size="11.5" fill="#475A72">Playwright E2E</text><rect x="890" y="288" width="130" height="70" rx="12" fill="#FFFFF