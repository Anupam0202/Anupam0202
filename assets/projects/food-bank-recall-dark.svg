<svg xmlns="http://www.w3.org/2000/svg" width="590" height="351" viewBox="0 0 590 351" role="img" aria-labelledby="title desc" fill="none"><title id="title">Food-Bank Recall Closure Agent</title><desc id="desc">Food-Bank Recall Closure Agent: From a recall notice to verified closure across every partner pantry. Exact UPC + lot match decides; partial matches go to people. ADK coordinator limited to eight allowlisted tools. Idempotent IDs survive Pub/Sub redelivery; hash-chained audit. 92 tests, Cloud Run + Pub/Sub, MIT licence. Stack: Python 3.12, Google ADK, Gemini, Firestore, Pub/Sub.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}.pk{display:none}}</style><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#0F1B2E"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1B2A42"/></pattern><clipPath id="clip"><rect width="590" height="351" rx="18"/></clipPath><radialGradient id="glow"><stop offset="0" stop-color="#4ADE80" stop-opacity=".20"/><stop offset="1" stop-color="#4ADE80" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="590" height="351" rx="18" fill="url(#bgGrad)"/><rect x="0" y="0" width="590" height="351" rx="18" fill="url(#dots)" opacity="0.7"/><rect x="0.75" y="0.75" width="588.5" height="349.5" rx="18" fill="none" stroke="#24354E" stroke-width="1.5"/><g clip-path="url(#clip)"><circle cx="560" cy="0" r="210" fill="url(#glow)"/></g><rect x="0" y="26" width="4" height="48" rx="2" fill="#4ADE80"/><text x="28" y="43" font-size="11.5" fill="#4ADE80" font-weight="700" letter-spacing="1.3" class="m">02 · AGENTS WITH GUARDRAILS</text><text x="564" y="47" font-size="19" fill="#6B819C" font-weight="700" text-anchor="end">↗</text><text x="26" y="86" font-size="28" fill="#EAF1FA" font-weight="800" letter-spacing="-0.4">Food-Bank Recall Closure Agent</text><text x="27" y="117" font-size="16.5" fill="#EAF1FA" font-weight="500">From a recall notice to verified</text><text x="27" y="139.44" font-size="16.5" fill="#EAF1FA" font-weight="500">closure across every partner pantry.</text><path d="M30 168.38l3.8 3.8l7 -7.6" stroke="#4ADE80" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="173.88" font-size="14.75" fill="#9DB0C7">Exact UPC + lot match decides; partial matches go to people</text><path d="M30 196.88l3.8 3.8l7 -7.6" stroke="#4ADE80" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="202.38" font-size="14.75" fill="#9DB0C7">ADK coordinator limited to eight allowlisted tools</text><path d="M30 225.38l3.8 3.8l7 -7.6" stroke="#4ADE80" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="230.88" font-size="14.75" fill="#9DB0C7">Idempotent IDs survive Pub/Sub redelivery; hash-chained audit</text><text x="27" y="285" font-size="12.5" fill="#6B819C" font-weight="600" class="m">Python 3.12 · Google ADK · Gemini · Firestore · Pub/Sub</text><rect x="26" y="301" width="80.04" height="31" rx="15.5" fill="#111B2C" stroke="#24354E" stroke-width="1"/><text x="66.02" y="321.5" font-size="13.5" fill="#9DB0C7" text-anchor="middle"><tspan font-weight="800" fill="#EAF1FA">92</tspan> tests</text><rect x="114.04" y="301" width="176.83" height="31" rx="15.5" fill="#111B2C" stroke="#24354E" stroke-width="1"/><text x="202.46" y="321.5" font-size="13.5" fill="#9DB0C7" text-anchor="middle"><tspan font-weight="800" fill="#EAF1FA">Cloud Run</tspan> + Pub/Sub</text><rect x="298.87" y="301" width="103.47" height="31" rx="15.5" fill="#111B2C" stroke="#24354E" stroke-width="1"/><text x="350.61" y="321.5" font-size="13.5" fill="#9DB0C7" text-anchor="middle"><tspan font-weight="800" fill="#EAF1FA">MIT</tspan> licence</text></svg>
