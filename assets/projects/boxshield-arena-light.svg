<svg xmlns="http://www.w3.org/2000/svg" width="590" height="351" viewBox="0 0 590 351" role="img" aria-labelledby="title desc" fill="none"><title id="title">BoxShield Arena</title><desc id="desc">BoxShield Arena: Red-teams AI agents and measures what each guardrail costs. Bounded attack corpus against a sandboxed synthetic agent. Allowlisted guardrail patches; HMAC-signed run capsules. Recorded replay: safety 26 → 89 with utility 100 → 80. 60 TestBox tests, Replay mode, Apache-2.0 licence. Stack: BoxLang, bx-ai, TestBox, Java 21, Docker.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}.pk{display:none}}</style><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F7FD"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#E3EBF5"/></pattern><clipPath id="clip"><rect width="590" height="351" rx="18"/></clipPath><radialGradient id="glow"><stop offset="0" stop-color="#BE185D" stop-opacity=".20"/><stop offset="1" stop-color="#BE185D" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="590" height="351" rx="18" fill="url(#bgGrad)"/><rect x="0" y="0" width="590" height="351" rx="18" fill="url(#dots)" opacity="0.7"/><rect x="0.75" y="0.75" width="588.5" height="349.5" rx="18" fill="none" stroke="#D7E1EE" stroke-width="1.5"/><g clip-path="url(#clip)"><circle cx="560" cy="0" r="210" fill="url(#glow)"/></g><rect x="0" y="26" width="4" height="48" rx="2" fill="#BE185D"/><text x="28" y="43" font-size="11.5" fill="#BE185D" font-weight="700" letter-spacing="1.3" class="m">04 · AGENTS WITH GUARDRAILS</text><text x="564" y="47" font-size="19" fill="#7A8DA6" font-weight="700" text-anchor="end">