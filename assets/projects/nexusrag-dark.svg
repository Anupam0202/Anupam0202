<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc" fill="none"><title id="title">NexusRAG — flagship project</title><desc id="desc">NexusRAG: Cite-or-abstain document research on a tenant-scoped edge runtime. Pipeline: Next.js 16 (frontend on Cloudflare) → Gateway (tenant-scoped API) → Supabase (auth · records · storage) → Qdrant (vectors fenced by workspace) → Gemini (quota + budget gated) → Citation gate (cite every claim or abstain). Hybrid lexical + dense retrieval, rank-blended per workspace. Research lane: BM25 + RRF, cross-encoder rerank, semantic cache. Eval harness: recall@k, MRR, nDCG, citation precision, leakage. Per-account Gemini keys sealed with AES-GCM; fails closed. 465 tests, 72 test files, 5 CI workflows, MIT licence. Stack: Next.js 16, Cloudflare Workers, Supabase, Qdrant, Gemini, FastAPI, Python, TypeScript.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}.pk{display:none}}.pk{animation:pk 5s linear infinite}@keyframes pk{0%{transform:translateY(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateY(240px);opacity:0}}</style><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#0F1B2E"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1B2A42"/></pattern><clipPath id="clip"><rect width="1200" height="400" rx="22"/></clipPath><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EA0FF"/><stop offset=".55" stop-color="#2DD4BF"/><stop offset="1" stop-color="#4ADE80"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#5EA0FF" stop-opacity=".18"/><stop offset="1" stop-color="#5EA0FF" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1200" height="400" rx="22" fill="url(#bgGrad)"/><rect x="0" y="0" width="1200" height="400" rx="22" fill="url(#dots)" opacity="0.7"/><rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="22" fill="none" stroke="#24354E" stroke-width="1.5"/><g clip-path="url(#clip)"><circle cx="1050" cy="-40" r="380" fill="url(#glow)"/></g><rect x="40" y="36" width="110.09" height="26" rx="13" fill="#111B2C" stroke="#24354E" stroke-width="1"/><text x="95.04" y="52.96" font-size="11" fill="#5EA0FF" font-weight="700" text-anchor="middle" class="m">FLAGSHIP · 01</text><text x="38" y="112" font-size="46" fill="#EAF1FA" font-weight="800" letter-spacing="-1">NexusRAG</text><text x="40" y="148" font-size="19" fill="#EAF1FA" font-weight="500">Cite-or-abstain document research</text><text x="40" y="173.65" font-size="19" fill="#EAF1FA" font-weight="500">on a tenant-scoped edge runtime.</text><circle cx="46" cy="214.3" r="3.2" fill="#2DD4BF"/><text x="60" y="219.3" font-size="14.75" fill="#9DB0C7">Hybrid lexical + dense retrieval, rank-blended per workspace</text><circle cx="46" cy="244.3" r="3.2" fill="#2DD4BF"/><text x="60" y="249.3" font-size="14.75" fill="#9DB0C7">Research lane: BM25 + RRF, cross-encoder rerank, semantic cache</text><circle cx="46" cy="274.3" r="3.2" fill="#2DD4BF"/><text x="60" y="279.3" font-size="14.75" fill="#9DB0C7">Eval harness: recall@k, MRR, nDCG, citation precision, leakage</text><circle cx="46" cy="304.3" r="3.2" fill="#2DD4BF"/><text x="60" y="309.3" font-size="14.75" fill="#9DB0C7">Per-account Gemini keys sealed with AES-GCM; fails closed</text><rect x="40" y="342" width="89.23" height="26" rx="13" fill="#111B2C" stroke="#24354E" stroke-width="1"/><text x="84.61" y="359.14" font-size="11.5" fill="#EAF1FA" text-anchor="middle" class="m">Next.js 16</text><rect x="137.23" y="342" width="144.61" height="26" rx="13" fill="#111B2C" stroke="#24354E" stroke-width="1"/><text x="209.54" y="359.14" font-size="11.5" fill="#EAF1FA" text-anchor="middle" class="m">Cloudflare Workers</text><rect x="289.84" y="342" width="75.38" height="26" rx="13" fill="#111B2C" stroke="#24354E" stroke-width="1"/><text x="327.54" y="359.14" font-size="11.5" fill="#EAF1FA" text-anchor="middle" class="m">Supabase</text><rect x="373.23" y="342" width="61.54" height="26" rx="13" fill="#111B2C" stroke="#24354E" stroke-width="1"/><text x="404" y="359.14" font-size="11.5" fill="#EAF1FA" text-anchor="middle" class="m">Qdrant</text><rect x="442.77" y="342" width="61.54" height="26" rx="13" fill="#111B2C" stroke="#24354E" stroke-width="1"/><text x="473.54" y="359.14" font-size="11.5" fill="#EAF1FA" text-anchor="middle" class="m">Gemini</text><rect x="512.3" y="342" width="33.85" height="26" rx="13" fill="#111B2C" stroke="#24354E" stroke-width="1"/><text x="529.23" y="359.14" font-size="11.5" fill="#9DB0C7" text-anchor="middle" class="m">+3</text><rect x="610" y="42" width="550" height="228" rx="16" fill="#15223A" stroke="#24354E" stroke-width="1"/><text x="630" y="68" font-size="10.5" fill="#6B819C" font-weight="700" letter-spacing="1.4" class="m">HOW IT WORKS</text><path d="M640 94V249" stroke="#30486B" stroke-width="2"/><circle class="pk" cx="640" cy="94" r="4" fill="#2DD4BF"/><circle cx="640" cy="94" r="7" fill="#15223A" stroke="#5EA0FF" stroke-width="2"/><text x="660" y="99.5" font-size="15.5" fill="#EAF1FA" font-weight="750">Next.js 16</text><text x="816" y="99" font-size="13" fill="#9DB0C7" class="m">frontend on Cloudflare</text><circle cx="640" cy="125" r="7" fill="#15223A" stroke="#5EA0FF" stroke-width="2"/><text x="660" y="130.5" font-size="15.5" fill="#EAF1FA" font-weight="750">Gateway</text><text x="816" y="130" font-size="13" fill="#9DB0C7" class="m">tenant-scoped API</text><circle cx="640" cy="156" r="7" fill="#15223A" stroke="#5EA0FF" stroke-width="2"/><text x="660" y="161.5" font-size="15.5" fill="#EAF1FA" font-weight="750">Supabase</text><text x="816" y="161" font-size="13" fill="#9DB0C7" class="m">auth · records · storage</text><circle cx="640" cy="187" r="7" fill="#15223A" stroke="#5EA0FF" stroke-width="2"/><text x="660" y="192.5" font-size="15.5" fill="#EAF1FA" font-weight="750">Qdrant</text><text x="816" y="192" font-size="13" fill="#9DB0C7" class="m">vectors fenced by workspace</text><circle cx="640" cy="218" r="7" fill="#15223A" stroke="#5EA0FF" stroke-width="2"/><text x="660" y="223.5" font-size="15.5" fill="#EAF1FA" font-weight="750">Gemini</text><text x="816" y="223" font-size="13" fill="#9DB0C7" class="m">quota + budget gated</text><circle cx="640" cy="249" r="7" fill="#15223A" stroke="#4ADE80" stroke-width="2"/><text x="660" y="254.5" font-size="15.5" fill="#4ADE80" font-weight="750">Citation gate</text><text x="816" y="254" font-size="13" fill="#9DB0C7" class="m">cite every claim or abstain</text><rect x="610" y="288" width="130" height="70" rx="12" fill="#111B2C" stroke="#24354E" stroke-width="1"/><text x="624" y="320" font-size="22" fill="#EAF1FA" font-weight="800">465</text><text x="624" y="340" font-size="11.5" fill="#9DB0C7">tests</text><rect x="750" y="288" width="130" height="70" rx="12" fill="#111B2C" stroke="#24354E" stroke-width="1"/><text x="764" y="320" font-size="22" fill="#EAF1FA" font-weight="800">72</text><text x="764" y="340" font-size="11.5" fill="#9DB0C7">test files</text><rect x="890" y="288" width="130" height="70" rx="12" fill="#111B2C" stroke="#24354E" stroke-width="1"/><text x="904" y="320" font-size="22" fill="#EAF1FA" font-weight="800">5</text><text x="904" y="340" font-size="11.5" fill="#9DB0C7">CI workflows</text><rect x="1030" y="288" width="130" height="70" rx="12" fill="#111B2C" stroke="#24354E" stroke-width="1"/><text x="1044" y="320" font-size="22" fill="#EAF1FA" font-weight="800">MIT</text><text x="1044" y="340" font-size="11.5" fill="#9DB0C7">licence</text><text x="1160" y="372" font-size="10.5" fill="#6B819C" text-anchor="end" class="m">test defi