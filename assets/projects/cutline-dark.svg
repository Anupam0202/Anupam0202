<svg xmlns="http://www.w3.org/2000/svg" width="590" height="351" viewBox="0 0 590 351" role="img" aria-labelledby="title desc" fill="none"><title id="title">CUTLINE</title><desc id="desc">CUTLINE: Fact-check approvals that expire the moment the script changes. SHA-256 fingerprints bind each review to cue, evidence and edit. Gemini on Vertex AI judges only the excerpts search returned. A state machine owns transitions: research proposes, never approves. 30 tests, Cloud Run deploy, MIT licence. Stack: Python 3.12, FastAPI, Vertex AI, Google ADK, Firestore.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}.pk{display:none}}</style><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#0F1B2E"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1B2A42"/></pattern><clipPath id="clip"><rect width="590" height="351" rx="18"/></clipPath><radialGradient id="glow"><stop offset="0" stop-color="#A78BFA" stop-opacity=".20"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="590" height="351" rx="18" fill="url(#bgGrad)"/><rect x="0" y="0" width="590" height="351" rx="18" fill="url(#dots)" opacity="0.7"/><rect x="0.75" y="0.75" width="588.5" height="349.5" rx="18" fill="none" stroke="#24354E" stroke-width="1.5"/><g clip-path="url(#clip)"><circle cx="560" cy="0" r="210" fill="url(#glow)"/></g><rect x="0" y="26" width="4" height="48" rx="2" fill="#A78BFA"/><text x="28" y="43" font-size="11.5" fill="#A78BFA" font-weight="700" letter-spacing="1.3" class="m">01 · AGENTS WITH GUARDRAILS</text><text x="564" y="47" font-size="19" fill="#6B819C" font-weight="700" t