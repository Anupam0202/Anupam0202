<svg xmlns="http://www.w3.org/2000/svg" width="590" height="351" viewBox="0 0 590 351" role="img" aria-labelledby="title desc" fill="none"><title id="title">RaceProof</title><desc id="desc">RaceProof: Turns a flaky JVM concurrency bug into a replayable, verified repair. Controlled scheduler replays interleavings; ddmin minimizes them. Source-linked causal witness, then a protected verifier. Gemini only diagnoses and proposes; a human signs off. 48 tests, Java target harness, MIT licence. Stack: Python, Java, Gemini, Docker, Make.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}.pk{display:none}}</style><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#0F1B2E"/></linearGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1B2A42"/></pattern><clipPath id="clip"><rect width="590" height="351" rx="18"/></clipPath><radialGradient id="glow"><stop offset="0" stop-color="#FBBF24" stop-opacity=".20"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="590" height="351" rx="18" fill="url(#bgGrad)"/><rect x="0" y="0" width="590" height="351" rx="18" fill="url(#dots)" opacity="0.7"/><rect x="0.75" y="0.75" width="588.5" height="349.5" rx="18" fill="none" stroke="#24354E" stroke-width="1.5"/><g clip-path="url(#clip)"><circle cx="560" cy="0" r="210" fill="url(#glow)"/></g><rect x="0" y="26" width="4" height="48" rx="2" fill="#FBBF24"/><text x="28" y="43" font-size="11.5" fill="#FBBF24" font-weight="700" letter-spacing="1.3" class="m">03 · AGENTS WITH GUARDRAILS</text><text x="564" y="47" font-size="19" fill="#6B819C" font-weight="700" text-anchor="end">↗</text><text x="26" y="86" font-size="28" fill="#EAF1FA" font-weight="800" letter-spacing="-0.4">RaceProof</text><text x="27" y="117" font-size="16.5" fill="#EAF1FA" font-weight="500">Turns a flaky JVM concurrency bug</text><text x="27" y="139.44" font-size="16.5" fill="#EAF1FA" font-weight="500">into a replayable, verified repair.</text><path d="M30 168.38l3.8 3.8l7 -7.6" stroke="#FBBF24" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="173.88" font-size="14.75" fill="#9DB0C7">Controlled scheduler replays interleavings; ddmin minimizes them</text><path d="M30 196.88l3.8 3.8l7 -7.6" stroke="#FBBF24" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="202.38" font-size="14.75" fill="#9DB0C7">Source-linked causal witness, then a protected verifier</text><path d="M30 225.38l3.8 3.8l7 -7.6" stroke="#FBBF24" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="230.88" font-size="14.75" fill="#9DB0C7">Gemini only diagnoses and proposes; a human signs off</text><text x="27" y="285" font-size="12.5" fill="#6B819C" font-weight="600" class="m">Python · Java · Gemini · Docker · Make</text><rect x="26" y="301" width="80.04" height="31" rx="15.5" fill="#111B2C" stroke="#24354E" stroke-width="1"/><text x="66.02" y="321.5" font-size="13.5" fill="#9DB0C7" text-anchor="middle"><tspan font-weight="800" fill="#EAF1FA">48</tspan> tests</text><rect x="114.04" y="301" width="159.23" height="31" rx="15.5" fill="#111B2C" stroke="#24354E" stroke-width="1"/><text x="193.65" y="321.5" font-size="13.5" fill="#9DB0C7" text-anchor="middle"><tspan font-weight="800" fill="#EAF1FA">Java</tspan> target harness</text><rect x="281.27" y="301" width="103.47" height="31" rx="15.5" fill="#111B2C" stroke="#24354E" stroke-width="1"/><text x="333.01" y="321.5" font-size="13.5" fill="#9DB0C7" text-anchor="middle"><tspan font-weight="800" fill="#EAF1FA">MIT</tspan> licence</text></svg>
